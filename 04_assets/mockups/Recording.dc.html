<x-dc>

    a { color: #FF5A36; } a:hover { color: #E8267F; }

  </style>

<div style="width: 390px; height: 844px; background: #14100E; color: #FAF6F1; display: flex; flex-direction: column; align-items: center; padding: 28px 24px 32px; box-sizing: border-box;">

  <div style="width: 100%; display: flex; justify-content: space-between; align-items: center;">

    </div>
  </div>

    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
    <span style="font-size: 13px; font-weight: 600;">Good level</span>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="width: 100%; display: flex; justify-content: center;">
    <div style="width: 84px; height: 84px; border-radius: 999px; background: linear-gradient(96deg, #FF5A36, #E8267F); display: flex; align-items: center; justify-content: center;">
      <div style="width: 30px; height: 30px; border-radius: 6px; background: #14100E;"></div>
    </div>
  </div>

  <div style="margin-top: 18px; font-size: 14px; color: rgba(250,246,241,0.45);">Tap to stop</div>

</div>

</html>
