<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900&display=swap">
  <style>
    body { margin: 0; font-family: 'Archivo', system-ui, sans-serif; }
    a { color: #FF5A36; } a:hover { color: #E8267F; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #14100E; color: #FAF6F1; display: flex; flex-direction: column; padding: 28px 24px 32px; box-sizing: border-box;">

  <div style="display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 14px; background: rgba(31,138,84,0.13); border: 1px solid rgba(31,138,84,0.32);">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4FBF85" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
    <span style="font-size: 15px; font-weight: 700; color: #4FBF85;">You got it</span>
  </div>

  <div style="margin-top: 26px; font-size: 12px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(250,246,241,0.42);">The word was</div>
  <div style="margin-top: 8px; font-size: 40px; line-height: 1; font-weight: 800; font-stretch: 125%; letter-spacing: -0.02em;">KGOMO</div>

  <div style="margin-top: 28px; padding: 18px 20px; border-radius: 16px; background: #2A231F; border: 1px solid rgba(250,246,241,0.07);">
    <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(250,246,241,0.40);">Your free-text answer is locked</div>
    <div style="margin-top: 9px; font-size: 19px; font-weight: 700;">kgomo</div>
    <div style="margin-top: 14px; height: 1px; background: rgba(250,246,241,0.08);"></div>
    <div style="margin-top: 14px; display: flex; align-items: center; gap: 9px; color: rgba(250,246,241,0.62); font-size: 14px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 3v18M5 10l7-7 7 7"></path></svg>
      <span>The other verifier stays hidden until you referee</span>
    </div>
  </div>

  <div style="margin-top: 30px; padding: 22px 20px; border-radius: 18px; background: rgba(138,106,31,0.11); border: 1.5px solid rgba(138,106,31,0.45);">
    <div style="display: flex; align-items: flex-start; gap: 11px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C99A2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;"><path d="M12 9v4"></path><path d="M12 17h.01"></path><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path></svg>
      <div>
        <div style="font-size: 17px; font-weight: 700; line-height: 1.25;">Did they say the word, or any banned word?</div>
        <div style="margin-top: 7px; font-size: 13px; color: rgba(250,246,241,0.52); line-height: 1.45;">Nobody can check this but you. Two of you agreeing voids the round.</div>
      </div>
    </div>
    <div style="margin-top: 18px; display: flex; gap: 10px;">
      <div style="flex-grow: 1; padding: 15px; border-radius: 12px; background: #2A231F; border: 1.5px solid rgba(250,246,241,0.12); text-align: center; font-size: 16px; font-weight: 700; min-height: 44px; box-sizing: border-box;">No</div>
      <div style="flex-grow: 1; padding: 15px; border-radius: 12px; background: rgba(192,52,26,0.16); border: 1.5px solid rgba(192,52,26,0.55); color: #E8674C; text-align: center; font-size: 16px; font-weight: 700; min-height: 44px; box-sizing: border-box;">Yes, they did</div>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-radius: 14px; background: rgba(255,203,5,0.09); border: 1px solid rgba(255,203,5,0.24);">
    <span style="font-size: 14px; color: rgba(250,246,241,0.72);">Proficient verification</span>
    <span style="font-size: 20px; font-weight: 800; color: #FF8A6E; font-variant-numeric: tabular-nums;">+15 XP</span>
  </div>

  <div style="margin-top: 14px; padding: 19px; border-radius: 16px; background: linear-gradient(96deg, #FF5A36, #E8267F); color: #14100E; font-size: 18px; font-weight: 800; text-align: center; min-height: 44px; box-sizing: border-box;">Next one</div>

</div>
</x-dc>
</body>
</html>
