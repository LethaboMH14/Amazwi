<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap">
  <style>
    body { margin: 0; font-family: 'Archivo', system-ui, sans-serif; }
    a { color: #0a3706; } a:hover { color: #06aa5b; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 390px; min-height: 844px; background: #FBF8F2; color: #0a3706; padding: 20px 20px 32px; display: flex; flex-direction: column; gap: 20px">

  <div style="display: flex; flex-direction: column; gap: 4px">
    <p style="margin: 0; font-size: 11px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #143612b2">isiZulu contribution</p>
    <h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.15">Say the card aloud</h1>
  </div>

  <!-- The play card. The target word is the largest thing on the screen:
       it is what the speaker is being asked to describe. -->
  <div style="padding: 20px 16px; border-radius: 12px; background: #ffffff; border: 1px solid #073a0329; box-shadow: 0 1px 2px #00000014">
    <p style="margin: 0 0 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #143612b2">Your word</p>
    <p style="margin: 0 0 18px; font-size: 40px; font-weight: 800; letter-spacing: -0.035em; line-height: 1">indiza</p>

    <p style="margin: 0 0 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #143612b2">Don&rsquo;t say</p>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <span style="padding: 6px 12px; border-radius: 999px; background: #FDF2F0; border: 1px solid #E8452A40; color: #A8321C; font-size: 13px; font-weight: 600">ndiza</span>
      <span style="padding: 6px 12px; border-radius: 999px; background: #FDF2F0; border: 1px solid #E8452A40; color: #A8321C; font-size: 13px; font-weight: 600">isibhakabhaka</span>
      <span style="padding: 6px 12px; border-radius: 999px; background: #FDF2F0; border: 1px solid #E8452A40; color: #A8321C; font-size: 13px; font-weight: 600">uhambo</span>
      <span style="padding: 6px 12px; border-radius: 999px; background: #FDF2F0; border: 1px solid #E8452A40; color: #A8321C; font-size: 13px; font-weight: 600">inkundla</span>
    </div>
  </div>

  <!-- Recording state: timer, live level meter, and the stop control. -->
  <div style="display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px 16px; border-radius: 12px; background: #EFF4EB; border: 1px solid #073a0329">
    <div style="display: flex; align-items: center; gap: 8px">
      <span style="width: 9px; height: 9px; border-radius: 50%; background: #E8452A"></span>
      <span style="font-size: 30px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">0:12</span>
      <span style="font-size: 13px; color: #143612b2">/ 0:30</span>
    </div>

    <div style="display: flex; align-items: flex-end; gap: 3px; height: 44px">
      <span style="width: 4px; height: 12px; border-radius: 2px; background: #06aa5b"></span>
      <span style="width: 4px; height: 26px; border-radius: 2px; background: #06aa5b"></span>
      <span style="width: 4px; height: 38px; border-radius: 2px; background: #06aa5b"></span>
      <span style="width: 4px; height: 20px; border-radius: 2px; background: #06aa5b"></span>
      <span style="width: 4px; height: 44px; border-radius: 2px; background: #06aa5b"></span>
      <span style="width: 4px; height: 30px; border-radius: 2px; background: #06aa5b"></span>
      <span style="width: 4px; height: 16px; border-radius: 2px; background: #06aa5b"></span>
      <span style="width: 4px; height: 34px; border-radius: 2px; background: #06aa5b"></span>
      <span style="width: 4px; height: 22px; border-radius: 2px; background: #06aa5b"></span>
      <span style="width: 4px; height: 12px; border-radius: 2px; background: #06aa5b99"></span>
      <span style="width: 4px; height: 8px; border-radius: 2px; background: #06aa5b66"></span>
      <span style="width: 4px; height: 6px; border-radius: 2px; background: #06aa5b40"></span>
    </div>

    <p style="margin: 0; font-size: 13px; color: #143612b2; text-align: center">Your audio stays private until approved peers verify it.</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; margin-top: auto">
    <div style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 26px; background: #E8452A; color: #ffffff; font-size: 16px; font-weight: 700">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#ffffff"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      Stop recording
    </div>
    <div style="display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 24px; background: #ffffff; border: 1px solid #073a0329; font-size: 15px; font-weight: 600">
      Start over
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
