[pytest]
# Adds the backend root to sys.path so `from app.models import Base` etc.
# resolve regardless of how pytest is invoked. Without this, bare
# `pytest -v` (as used in .github/workflows/ci.yml) does NOT add the
# current working directory to sys.path, so every test/conftest import of
# `app.*` fails with ModuleNotFoundError -- confirmed as the actual root
# cause of every backend CI failure tonight via `gh run view --log-failed`,
# not a missing-Postgres problem as first (incorrectly) diagnosed before
# gh auth access was available. `python -m pytest` happens to add cwd to
# sys.path automatically, which is why this was invisible in every local
# dev run (always run as `python -m pytest`) and only showed up in CI's
# plain `pytest -v` invocation.
pythonpath = .
